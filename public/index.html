<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipboardFileServer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>ClipboardFileServer</h1>
        <p id="serverState" class="muted">连接中</p>
      </div>
      <div class="top-actions">
        <input id="searchInput" class="search" type="search" placeholder="搜索">
        <button id="refreshButton" type="button">刷新</button>
      </div>
    </header>

    <section class="composer" id="pasteZone" tabindex="0" aria-label="剪贴板输入区">
      <textarea id="textInput" rows="4" placeholder="在这里粘贴文本、图片或文件"></textarea>
      <div class="composer-actions">
        <label class="file-picker">
          <input id="fileInput" type="file" multiple>
          选择文件
        </label>
        <button id="sendTextButton" type="button">保存文本</button>
      </div>
    </section>

    <section class="list-head">
      <h2>历史</h2>
      <span id="itemCount" class="muted">0 条</span>
    </section>

    <section id="items" class="items" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
